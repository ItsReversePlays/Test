<!DOCTYPE html>
<html>
<head>
  <title>C++ to Blueprint Converter</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="container">
    <div class="heading">
      <h1 class="title">C++ to Blueprint Converter</h1>
      <p class="description">Enter your C++ code below to convert it to a Blueprint representation.</p>
    </div>

    <div class="converter-container">
      <div class="input-container">
        <h2>C++ Code</h2>
        <textarea id="cpp-code" placeholder="Enter C++ code here..."></textarea>
        <button id="convert-btn">Convert</button>
      </div>
      <div class="output-container">
        <h2>Blueprint Output</h2>
        <div id="blueprint-output"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
